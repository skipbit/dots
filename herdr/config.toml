onboarding = false                     # 既定: true
# herdr <https://herdr.dev/docs/>
#
# 既定値の全文は `herdr --default-config` で出る。ここに書くのは
#   (1) tmux の身体記憶に合わせるための差分
#   (2) herdr 固有の機能のうち、既定では無効になっているもの
# を中心に、書かなかった項目は herdr の既定に追随させる。
# 既定と同じ値をあえて書いている行もあり、その理由は行末に書いてある。
# 行末の「既定:」は herdr --default-config の値。
#
# 検証 ... herdr config check       (未知キー・不正なキー名をその場で指摘する)
# 反映 ... herdr server reload-config / <prefix> R   (セッションごとに必要)
#
# [tmux からの対応表]
# <prefix>          C-q             tmux と同じ
# <prefix> \        左右分割        tmux: bind \ split-window -h
# <prefix> -        上下分割        tmux: bind - split-window -v
# <prefix> h j k l  pane 移動       herdr の既定が既に同じ
# <prefix> H J K L  pane リサイズ   tmux: resize-pane (herdr のリサイズモード <prefix> r も残してある)
# <prefix> ;        直前の pane
# <prefix> [        コピーモード    herdr の既定が既に同じ (vi キーも最初から入っている)
# <prefix> d        デタッチ
# <prefix> ( )      workspace 巡回  tmux のセッション切り替え
# <prefix> c n p 1-9 x z ?          herdr の既定が既に tmux と同じ

[theme]
# name は設定画面 (<prefix> s) からも変更でき、herdr がこのファイルに書き戻す。
# 選べるのは catppuccin / terminal / tokyo-night / dracula / nord /
# gruvbox / one-dark / solarized / kanagawa / rose-pine / vesper。
name = "terminal"                      # 既定: "catppuccin"
auto_switch = false                    # 既定: false (設定画面が書き込んだ行)

[theme.custom]
# ベーステーマの色トークンを個別に上書きする。既定はいずれも未設定 (テーマの値のまま)。
# accent = pane の分割線 (フォーカスしている pane に接する線) と各種ハイライト。
#   ※ [ui] の accent は別物で、分割線には効かない (実測)。
# 他に sidebar_bg / active_row_bg / surface_dim / panel_bg / red / green / yellow。
accent = "#8be9fd"                     # 既定: 未設定 (terminal テーマでは ANSI blue)
# navigate モード (<prefix> w / g) で選択中の行。terminal テーマは既定だと
# 実質透明で、選択が太字だけの差になって見えないので明示的に敷く。
selection_bg = "#005f87"               # 既定: 未設定

[keys]
# tmux と同じ prefix。C-b はシェルの後方移動に使うので空けておく。
prefix = "ctrl+q"                      # 既定: "ctrl+b"

# --- tmux に合わせて振り直すもの ---
detach = "prefix+d"                    # 既定: "prefix+q"
copy_mode = "prefix+["                 # 既定: "prefix+[" (同じ。tmux と一致するので明示)
split_vertical = "prefix+\\"           # 既定: "prefix+v"   左右分割。API 上は direction=right
split_horizontal = "prefix+minus"      # 既定: "prefix+minus" (同じ。上の行と対で読めるように明示)
last_pane = "prefix+;"                 # 既定: 未設定   tmux の直前 pane
resize_pane_left = "prefix+shift+h"    # 既定: 未設定   tmux の <prefix> H J K L。
resize_pane_down = "prefix+shift+j"    # 既定: 未設定     herdr のリサイズモード (prefix+r) も既定のまま残る
resize_pane_up = "prefix+shift+k"      # 既定: 未設定
resize_pane_right = "prefix+shift+l"   # 既定: 未設定
swap_pane_left = "prefix+{"            # 既定: 未設定   tmux の <prefix> { }。herdr のそれは方向指定
swap_pane_right = "prefix+}"           # 既定: 未設定
previous_workspace = "prefix+("        # 既定: 未設定   tmux のセッション切り替え
next_workspace = "prefix+)"            # 既定: 未設定

# --- herdr 固有。既定では未割り当てなので有効化する ---
previous_agent = "prefix+ctrl+p"       # 既定: 未設定   タブの p / n と同じ意味を一段深いレイヤーで
next_agent = "prefix+ctrl+n"           # 既定: 未設定

# --- 既定のまま使うもの (上書きしない) ---
#   prefix+?          ヘルプ
#   prefix+c          新規タブ            tmux と同じ
#   prefix+n / p      次/前のタブ         tmux と同じ
#   prefix+1..9       タブ選択            tmux と同じ
#   prefix+x          pane を閉じる       tmux と同じ
#   prefix+z          zoom                tmux と同じ
#   prefix+tab        pane 循環           tmux の <prefix> o に相当
#   prefix+o          通知元へジャンプ    herdr 固有。tmux の <prefix> o とは別物なので潰さない
#   prefix+w          navigate モード     上下で workspace、tab で pane、g でナビゲーターへ。
#                     矢印は選択を動かすだけで、確定は Enter
#   prefix+g          ナビゲーター        workspace / pane / エージェントの検索付きピッカー。
#                     j k ↑↓ で選択、enter で移動、/ で検索、b w i d a で状態を絞る。
#                     エージェントを選ぶ手段はここ。数字で直接飛ぶ focus_agent と
#                     switch_workspace は割り当てない (ctrl+数字 は拡張キー必須、
#                     shift+数字 は JIS 配列で 2 6 7 8 9 が届かない、alt は指に無理)
#   prefix+e          スクロールバックを $EDITOR で開く   herdr 固有
#   prefix+b          サイドバー開閉
#   prefix+r          リサイズモード      (tmux で設定リロードに使う位置なので注意)
#   prefix+shift+r    設定リロード
#   prefix+shift+n    新規 workspace
#   prefix+shift+g    新規 worktree
#   prefix+shift+w    workspace 名変更    rename は herdr の流儀 (w / t / p) で揃える
#   prefix+shift+t    タブ名変更
#   prefix+shift+p    pane 名変更
#   prefix+shift+x    タブを閉じる        tmux の <prefix> & に寄せるなら close_tab = "prefix+&"
#   prefix+shift+d    workspace を閉じる

# tmux の display-popup 相当。レイアウトを崩さずに一時的な pane を出せる。
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "tig status"
# width = "80%"
# height = "80%"

[ui]
# pane が 1 つのタブには herdr は枠を描かない (設定では変えられない)。そのため
# 分割した瞬間に中身が 1 行 1 列ずれる。false にすればずれないが枠も消える。
pane_outer_borders = true              # 既定: true (同じ。ずれるが枠を優先して明示)
pane_gaps = false                      # 既定: true   分割線を共有して詰めて並べる

# tmux の pane-border-format 相当。pane に名前を付けていないときは
# 検出したエージェント名が枠に出る。
show_agent_labels_on_pane_borders = true   # 既定: false

# tmux の <prefix> c と同じく、名前を聞かずにタブを作る。
prompt_new_tab_name = false            # 既定: true
                                       # (workspace 側の prompt_new_workspace_name は既定 false)

# タブバー右端。zoom 中の pane がある印と、ホスト名を出す。
# 他に置けるのは datetime / text / command。
tab_bar_right = [                      # 既定: [] (何も出さない)
    { type = "zoom" },
    { type = "hostname" },
]

# マウスは herdr 側が掴む既定のまま (mouse UI と選択即コピーが使える)。
# tmux (マウス無効) の感覚に戻すなら以下を有効にする。
# mouse_capture = false                # 既定: true
# copy_on_select = false               # 既定: true

[ui.toast]
# 背景 workspace のエージェントが止まったことに気付けるようにする。
# "terminal" / "system" にすると OS の通知に飛ばせる。
delivery = "herdr"                     # 既定: "off"

[update]
# Homebrew で入れているので、herdr 自身の更新チェックはしない (brew upgrade herdr で上げる)。
# エージェント検出定義 (manifest_check、既定 true) はバイナリと無関係なので既定のまま残す。
version_check = false                  # 既定: true

[experimental]
# 日本語入力まわり。どちらも macOS 向けで、Linux では実質無視される。
#   prefix 中だけ ASCII 入力へ切り替える / 変換候補ウィンドウが
#   TUI の描くカーソルを見失わないようにする (対象は claude の pane だけに絞る)。
switch_ascii_input_source_in_prefix = true  # 既定: false
reveal_hidden_cursor_for_cjk_ime = true     # 既定: false
cjk_ime_agents = ["claude"]                 # 既定: []
